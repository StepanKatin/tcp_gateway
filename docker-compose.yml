services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxclients",
        "20000",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  tcp_gateway:
    build:
      context: ./tcp_gateway
      dockerfile: dockerfile
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      REDIS_URL: ${REDIS_URL}
      TCP_TIMEOUT: ${TCP_TIMEOUT:-60}
      REDIS_STREAM_NAME: ${REDIS_STREAM_NAME:-telemetry.points}
      REDIS_STREAM_MAXLEN: ${REDIS_STREAM_MAXLEN:-100000}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-512}
      HTTP_HOST: ${GATEWAY_HTTP_HOST:-0.0.0.0}
      HTTP_PORT: ${GATEWAY_HTTP_PORT:-8001}
      PYTHONPATH: /app/app
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-telemetry}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/users.d/00-remote-access.xml:/etc/clickhouse-server/users.d/00-remote-access.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s
    restart: unless-stopped

  loader:
    build:
      context: ./loader
      dockerfile: dockerfile
    ports:
      - "8002:8002"
    environment:
      REDIS_URL: ${REDIS_URL}
      REDIS_STREAM_NAME: ${REDIS_STREAM_NAME:-telemetry.points}
      REDIS_CONSUMER_GROUP: ${REDIS_CONSUMER_GROUP:-loader}
      REDIS_CONSUMER_NAME: ${REDIS_CONSUMER_NAME:-loader-1}
      BATCH_STREAM_LEN: ${BATCH_STREAM_LEN:-500}
      STREAM_POLLING_INTERVAL_MS: ${STREAM_POLLING_INTERVAL_MS:-500}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-telemetry}
      HTTP_HOST: ${LOADER_HTTP_HOST:-0.0.0.0}
      HTTP_PORT: ${LOADER_HTTP_PORT:-8002}
      PYTHONPATH: /app/app
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9091:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      - tcp_gateway
      - loader
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  clickhouse_data:
